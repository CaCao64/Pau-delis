plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.pau.busapp'
    compileSdk 34
    defaultConfig {
        applicationId "com.pau.busapp"
        minSdk 24; targetSdk 34; versionCode 9; versionName "1.8"
        buildConfigField "String", "IDELIS_API_KEY", "\"3b8a958c-effe-4d40-8756-f42a20f14bd7\""
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    bundle {
        language {
            enableSplit = false
        }
    }
    lint {
        disable 'MissingTranslation',
                'OldTargetApi',
                'UnusedAttribute',
                'AndroidGradlePluginVersion',
                'GradleDependency',
                'NewerVersionAvailable',
                'PluralsCandidate',
                'StringFormatCount',
                'Overdraw',
                'UnusedResources',
                'HardcodedText',
                'RtlSymmetry',
                'Autofill',
                'ClickableViewAccessibility',
                'ContentDescription',
                'IconDuplicates',
                'IconLauncherShape',
                'IconLocation',
                'KeyboardInaccessibleWidget',
                'SetTextI18n',
                'SmallSp',
                'TypographyEllipsis',
                'UseKtx',
                'UselessParent'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = '11' }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    testImplementation 'junit:junit:4.13.2'
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}

afterEvaluate {
    tasks.withType(Test).configureEach {
        if (name.endsWith("UnitTest")) {
            enabled = false
        }
    }

    tasks.register("verifyPassageHelper", JavaExec) {
        dependsOn "compileDebugUnitTestKotlin", "compileDebugUnitTestJavaWithJavac", "compileDebugKotlin", "compileDebugJavaWithJavac"
        mainClass = "org.junit.runner.JUnitCore"
        classpath = files(
            "$buildDir/tmp/kotlin-classes/debugUnitTest",
            "$buildDir/tmp/kotlin-classes/debug",
            "$buildDir/intermediates/javac/debug/classes",
            configurations.getByName("debugUnitTestRuntimeClasspath"),
            android.bootClasspath
        )
        args "com.pau.busapp.PassageHelperTest"
    }

    tasks.named("check").configure {
        dependsOn tasks.named("verifyPassageHelper")
    }
}
